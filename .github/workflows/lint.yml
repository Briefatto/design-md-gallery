name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  design-md:
    name: Google DESIGN.md linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global @google/design.md@0.4.0
      - name: Lint every brands/*/DESIGN.md (errors fail, warnings allowed)
        run: |
          status=0
          count=0
          for file in brands/*/DESIGN.md; do
            count=$((count + 1))
            if ! design.md lint "$file" > /tmp/lint.json; then
              echo "::error file=$file::DESIGN.md linter reported errors"
              cat /tmp/lint.json
              status=1
            fi
          done
          echo "Linted $count files."
          exit $status
